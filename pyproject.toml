[build-system]
# setuptools>=77.0.3 is required for PEP 639 ``license-files`` support;
# recursive ``**`` package-data globs also remain supported at this floor.
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[project]
name = 'phenotypic'
dynamic = ["version"]

authors = [
    { name = 'Alexander Nguyen', email = "xander-git@protonmail.com" }
]


description = "An image processing framework created for Ex-FAB NSF BioFoundry that aims to streamline the development of image processing pipelines for images analysis of phenotypes."

readme = "README.md"
license-files = ["LICENSE", "NOTICE", "licenses/*.txt"]

requires-python = ">=3.10, <3.13"

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "pandas",
    "numpy",
    "seaborn",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "opencv-python",
    "h5py",
    "mahotas",
    "pillow",
    "tqdm",
    "mmh3",
    "psutil>=7.0.0",
    "colour-science>=0.4.6",
    "rawpy;sys_platform!='win32'",
    "threadpoolctl>=3.6.0",
    "pympler>=1.0.1",
    "exifread>=3.5.1",
    "click>=8.3.0",
    "bm3d>=4.0.3",
    "wand>=0.6.13",
    "tqdm-joblib>=0.0.5",
    "rich>=14.2.0",
    "imagecodecs>=2025.3.30",
    "findiff>=0.12.2",
    "numba>=0.62.1",
    "plotly>=6.0.0",
    "pyarrow>=23.0.1",
    "kaleido>=1.2.0",
    "ruptures>=1.1.9",
    "typing_extensions>=4.0.0",
    "pooch>=1.8",
    "dash>=4.1.0",
    "dash-cytoscape>=1.0.2",
    "dash-bootstrap-components>=2.0.4",
    "pydantic>=2.12.5",
    "python-lucide>=0.2.24",
    "polars[rtcompat]>=1.41.2",
    "duckdb>=1.5.4",
]

[project.urls]
Repository = "https://github.com/exfab/PhenoTypic"

[project.optional-dependencies]

gui = [
    # Templating (report/dashboard HTML)
    "jinja2>=3.1",
    # Jupyter integration
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "pyvips>=2.2", # optional fast path for DZI tile generation
]

napari = [
    # Interactive desktop viewers (image.*.napari(), point picker, pipeline
    # viewer, sweep viewer). Pulls PyQt6 via the [pyqt6] extra.
    "napari[optional,pyqt6]",
]

torch = [
    # SAM2 requires CUDA nvcc to compile from source — restrict to Linux/macOS.
    # micro_sam is conda-only (not on PyPI); see the self-service recipe in
    # docs/source/how_to/pages/gpu_detection_setup.md. MicroSamDetector
    # handles missing micro_sam gracefully at runtime.
    "torch>=2.5.1;sys_platform!='win32'",
    "torchvision>=0.20.1;sys_platform!='win32'",
    "sam2>=1.1.0;sys_platform!='win32'",
]

foundation = [
    # SAM3 + every DINO backbone collapse to transformers + huggingface_hub.
    # transformers>=5.2.0 is the first release shipping Sam3Model/Sam3Processor
    # and the DINO AutoModel route (Spec 2 O3, verified). Both are pure-Python
    # and permissive (Apache) — gated *weights* are fetched at runtime behind
    # the license-acceptance gate (Spec 2 §7), never at install time.
    "phenotypic[torch]",
    "transformers>=5.2.0",
    "huggingface_hub>=0.26",
]
gpu = ["phenotypic[torch,foundation]"]  # umbrella: every GPU detector

tune = [
    # Optuna backend for the tune engine (Phase 2). Imported lazily inside
    # phenotypic.tune._strategies._optuna_support so the base package and the
    # Grid/Random paths stay Optuna-free (optuna-integration.md §10).
    "optuna>=4.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]
topology = [
    "fil-finder==1.8",
    "gudhi==3.13.0",
]

[project.scripts]
phenotypic = "phenotypic.phenotypicCLI:phenotypic_cli"
phenotypic-gui = "phenotypic.gui.shell._launcher:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov",
    "mypy",
    "pytest-xdist>=3.8.0",
    "pympler>=1.0.1;sys_platform!='win32'",
    "jupyter;sys_platform!='win32'",
    "ipykernel;sys_platform!='win32'",
    "notebook;sys_platform!='win32'",
    "ipywidgets",
    "ruff>=0.14.7",
    "scipy-stubs>=1.15.3.0",
    "pytest-testmon>=2.2.0",
    "pytest-memray>=1.7.0;sys_platform!='win32'",
    # Phase 0 of GUI hub roll-out (see GUI_SPEC_V1.md). Browser E2E suite is
    # gated on the ``PLAYWRIGHT=1`` env var locally and on CI path filters.
    # Playwright skips Windows because upstream wheels are linux+macOS only.
    "pytest-playwright>=0.5.0;sys_platform!='win32'",
    "playwright>=1.45.0;sys_platform!='win32'",
    # Retries for the browser-E2E lane: the Playwright point-picker tests pass
    # locally but stochastically miss a viewport/DOM-poll budget on the shared
    # GHA runner; @pytest.mark.flaky(reruns=...) retries them. See tests/CLAUDE.md.
    "pytest-rerunfailures>=14.0",
    # FEATURES.md syntax + Test-ref pre-commit hook (see scripts/check_features_md.py).
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.3.3.260113",
    "types-tqdm>=4.67.3.20260518",
    "types-psutil>=7.2.2.20260518",
]
test-qt = [
    # Qt/napari widget tests. pytest-qt imports a Qt binding (PyQt6) at
    # configure time, so both must be present whenever these tests run.
    # The napari extra also pulls pyqt6 via napari[pyqt6]; uv dedupes the
    # overlap. This group keeps the Qt test deps installable without napari.
    "pytest-qt>=4.5.0",
    "pyqt6>=6.9.1",
]
docs = [
    "sphinx",
    "sphinxcontrib-napoleon",
    "sphinx-autodoc-typehints",
    "sphinx-autobuild",
    "sphinxawesome-theme",
    "pydata-sphinx-theme",
    "sphinx-gallery",
    "sphinx-autosummary-accessors",
    "sphinx-design",
    "nbsphinx",
    "myst-nb",
    "sphinx-togglebutton>=0.3.2",
    "pandoc>=2.4",
    "myst-parser>=4.0.1",
]


[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/smoke", "tests/integration", "tests/gui"]
# Default lane excludes -m slow so PR-time runs stay fast. CI nightly job
# should run `pytest -m slow` (or `-m "smoke or slow"`) for full coverage.
addopts = "--verbose --capture=no -m 'not slow'"
markers = [
    "smoke: basic operation test",
    "slow: heavy parametrize sweep, excluded from PR runs by default",
    "ci_flaky: e2e tests that pass locally but flake on shared CI runners (Playwright DOM polls); CI workflow deselects via `-m 'not ci_flaky'`. See tests/CLAUDE.md.",
    "postgres: tune study-DB tests needing a live Postgres server; autoskipped by tests/conftest.py unless PHENOTYPIC_TEST_PG_URL is set.",
    "slurm: distributed tune-worker-fleet tests needing the SLURM client (sbatch); autoskipped by tests/conftest.py unless sbatch is on PATH.",
]
filterwarnings = [
    "ignore::SyntaxWarning:mahotas",
]
# IMPORTANT: Do NOT combine --testmon and -n auto (SQLite concurrency issues)
# CI Strategy: PR checks use --testmon (sequential, selective)
#              Manual runs use -n auto (parallel, comprehensive)

[tool.setuptools.dynamic]
version = { attr = "phenotypic.__version__" }

[tool.setuptools.package-data]
"phenotypic" = [
    "data/*.jpg",
    "data/*.png",
    "_assets/logos/*",
    "_assets/logos/*/*",
    "_assets/vendor/*",
    "_assets/measurements/*",
    "_assets/measurements/*/*",
    "_assets/exemplars/*",
    # GUI sub-app static assets (shell/builder/results_viewer/browse/
    # run_console/analysis/tune): CSS/JS + vendored OpenSeadragon control
    # icons. Without these the ``phenotypic-gui`` entry point fails to
    # import (shell/_layout.py reads shell.css at import time) and the Dash
    # sub-apps load unstyled with broken image-viewer controls.
    "gui/**/*.css",
    "gui/**/*.js",
    "gui/**/*.png",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'x86_64'",
]
# Cap the Qt runtime on Linux to the last release that still ships a
# manylinux_2_28 wheel. PyQt6-Qt6 6.10+ require glibc 2.34, but the UCR
# HPCC nodes (RHEL 8) only have glibc 2.28, so newer wheels can't install.
constraint-dependencies = [
    "pyqt6-qt6<=6.9.0; sys_platform == 'linux'",
]

[tool.ruff]
line-length = 79
# Vendored upstream reference sources are pristine third-party copies that the
# `porting-a-reference-algorithm` workflow diffs our ports against line-by-line.
# `ruff check --fix` (the documented lint command) is repo-wide, so without this
# it silently rewrites them — stripping "unused" imports and reformatting calls —
# and the diff against upstream stops meaning anything. Never lint or fix them.
extend-exclude = ["docs/superpowers/**/refs"]

[tool.mypy]
plugins = ["pydantic.mypy"]

# Third-party libraries that ship neither type stubs nor a py.typed marker.
# pandas/tqdm/psutil are covered by the *-stubs / types-* packages in the dev
# dependency group; the modules below have no stubs available, so silence the
# import-untyped / import-not-found noise rather than littering the source with
# per-import `# type: ignore`s.
[[tool.mypy.overrides]]
module = [
    "napari.*",
    "plotly.*",
    "h5py",
    "h5py.*",
    "bm3d",
    "bm3d.*",
    "joblib",
    "ipywidgets",
    "sklearn.*",
    "sam2.*",
    "rawpy",
    "numba",
    "mahotas",
    "vispy.*",
    "ruptures",
    "pooch",
    "qtpy.*",
    # Optional accelerator / conda-only backends not installed in the dev env:
    # micro_sam is conda-only (not on PyPI); habana_frameworks is Intel Gaudi.
    "micro_sam.*",
    "habana_frameworks.*",
    # Foundation-model libs (Spec 2a): permissive but no first-party stubs.
    "transformers.*",
    "huggingface_hub.*",
]
ignore_missing_imports = true
