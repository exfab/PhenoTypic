[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[project]
name = 'phenotypic'
dynamic = ["version"]

authors = [
    { name = 'Alexander Nguyen', email = "xander-git@protonmail.com" }
]


description = "An image processing framework created for Ex-FAB NSF BioFoundry that aims to streamline the development of image processing pipelines for images analysis of phenotypes."

readme = "README.md"

requires-python = ">=3.10, <3.13"

classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]

dependencies = [
    "pandas",
    "numpy",
    "seaborn",
    "scikit-image",
    "scikit-learn",
    "scipy",
    "opencv-python",
    "h5py",
    "mahotas",
    "pillow",
    "tqdm",
    "mmh3",
    "psutil>=7.0.0",
    "colour-science>=0.4.6",
    "rawpy;sys_platform!='win32'",
    "threadpoolctl>=3.6.0",
    "pympler>=1.0.1",
    "exifread>=3.5.1",
    "polars>=1.0.0",
    "click>=8.3.0",
    "bm3d>=4.0.3",
    "wand>=0.6.13",
    "tqdm-joblib>=0.0.5",
    "rich>=14.2.0",
    "imagecodecs>=2025.3.30",
    "findiff>=0.12.2",
    "numba>=0.62.1",
    "plotly>=6.0.0",
    "pyarrow>=23.0.1",
    "duckdb>=1.2.0",
    "kaleido>=1.2.0",
    "ruptures>=1.1.9",
    "typing_extensions>=4.0.0",
    "pooch>=1.8",
    "dash>=4.1.0",
    "dash-cytoscape>=1.0.2",
    "dash-bootstrap-components>=2.0.4",
    "pydantic>=2.12.5",
]

[project.urls]
Repository = "https://github.com/Wheeldon-Lab/PhenoTypic"

[project.optional-dependencies]

gui = [
    # Napari visualization
    "napari[optional,pyqt6]",
    # Panel GUI components
    "panel>=1.3",
    "param>=2.0",
    "bokeh>=3.3",
    "jinja2>=3.1",
    "jupyter-bokeh>=4.0.5",
    # Jupyter integration
    "ipykernel>=6.31.0",
    "ipywidgets>=8.1.7",
    "jupyter>=1.1.1",
    "pyvips>=2.2", # optional fast path for DZI tile generation
]

torch = [
    # SAM2 requires CUDA nvcc to compile from source — restrict to Linux/macOS.
    # micro_sam is conda-only (not on PyPI); see the self-service recipe in
    # docs/source/how_to/pages/gpu_detection_setup.md. MicroSamDetector
    # handles missing micro_sam gracefully at runtime.
    "torch>=2.5.1;sys_platform!='win32'",
    "torchvision>=0.20.1;sys_platform!='win32'",
    "sam2;sys_platform!='win32'",
]

[project.scripts]
phenotypic = "phenotypic.phenotypicCLI:phenotypic_cli"
phenotypic-gui = "phenotypic.gui.shell._launcher:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov",
    "mypy",
    "pytest-xdist>=3.8.0",
    "pympler>=1.0.1;sys_platform!='win32'",
    "jupyter;sys_platform!='win32'",
    "ipykernel;sys_platform!='win32'",
    "notebook;sys_platform!='win32'",
    "ipywidgets",
    "ruff>=0.14.7",
    "scipy-stubs>=1.15.3.0",
    "pytest-testmon>=2.2.0",
    "pytest-qt>=4.5.0",
    "pytest-memray>=1.7.0;sys_platform!='win32'",
    # Phase 0 of GUI hub roll-out (see GUI_SPEC_V1.md). Browser E2E suite is
    # gated on the ``PLAYWRIGHT=1`` env var locally and on CI path filters.
    # Playwright skips Windows because upstream wheels are linux+macOS only.
    "pytest-playwright>=0.5.0;sys_platform!='win32'",
    "playwright>=1.45.0;sys_platform!='win32'",
    # FEATURES.md syntax + Test-ref pre-commit hook (see scripts/check_features_md.py).
    "pre-commit>=3.7.0",
    "pandas-stubs>=2.3.3.260113",
    "types-tqdm>=4.67.3.20260518",
    "types-psutil>=7.2.2.20260518",
]
docs = [
    "sphinx",
    "sphinxcontrib-napoleon",
    "sphinx-autodoc-typehints",
    "sphinx-autobuild",
    "sphinxawesome-theme",
    "pydata-sphinx-theme",
    "sphinx-gallery",
    "sphinx-autosummary-accessors",
    "sphinx-design",
    "nbsphinx",
    "myst-nb",
    "sphinx-togglebutton>=0.3.2",
    "pandoc>=2.4",
    "myst-parser>=4.0.1",
]


[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/smoke", "tests/integration"]
# Default lane excludes -m slow so PR-time runs stay fast. CI nightly job
# should run `pytest -m slow` (or `-m "smoke or slow"`) for full coverage.
addopts = "--verbose --capture=no -m 'not slow'"
markers = [
    "smoke: basic operation test",
    "slow: heavy parametrize sweep, excluded from PR runs by default",
    "ci_flaky: e2e tests that pass locally but flake on shared CI runners (Playwright DOM polls); CI workflow deselects via `-m 'not ci_flaky'`. See tests/CLAUDE.md.",
]
filterwarnings = [
    "ignore::SyntaxWarning:mahotas",
]
# IMPORTANT: Do NOT combine --testmon and -n auto (SQLite concurrency issues)
# CI Strategy: PR checks use --testmon (sequential, selective)
#              Manual runs use -n auto (parallel, comprehensive)

[tool.setuptools.dynamic]
version = { attr = "phenotypic.__version__" }

[tool.setuptools.package-data]
"phenotypic" = [
    "data/*.jpg",
    "data/*.png",
    "_cli/_assets/*.png",
    "gui/_shared/_static/*.svg",
]

[tool.uv]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'win32' and platform_machine == 'x86_64'",
]

[tool.ruff]
line-length = 79

[tool.mypy]
plugins = ["pydantic.mypy"]

# Third-party libraries that ship neither type stubs nor a py.typed marker.
# pandas/tqdm/psutil are covered by the *-stubs / types-* packages in the dev
# dependency group; the modules below have no stubs available, so silence the
# import-untyped / import-not-found noise rather than littering the source with
# per-import `# type: ignore`s.
[[tool.mypy.overrides]]
module = [
    "napari.*",
    "plotly.*",
    "h5py",
    "h5py.*",
    "bm3d",
    "bm3d.*",
    "joblib",
    "ipywidgets",
    "sklearn.*",
    "sam2.*",
    "rawpy",
    "numba",
    "mahotas",
    "vispy.*",
    "ruptures",
    "pooch",
    "param",
    "qtpy.*",
    # Optional accelerator / conda-only backends not installed in the dev env:
    # micro_sam is conda-only (not on PyPI); habana_frameworks is Intel Gaudi.
    "micro_sam.*",
    "habana_frameworks.*",
]
ignore_missing_imports = true
