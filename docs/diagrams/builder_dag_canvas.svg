<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1080 540"
     width="1080" height="540"
     role="img"
     aria-labelledby="title desc"
     font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="title">PhenoTypic pipeline builder — DAG canvas visual language</title>
  <desc id="desc">Reference diagram of the four canonical block shapes (Input Image green chevron, regular op with image-in / image-out / aux-in ports, Pipeline container with consumer-fed dot, validation-failing block with red border and exclamation badge) plus the blue image-flow and purple aux wires connecting them.</desc>

  <!-- Color palette (mirrors src/phenotypic/gui/_design.py):
       COLOR_NAVY    #003660  ops stage tint / borders
       COLOR_BLUE    #1b75bc  image-flow wires
       COLOR_GOLD    #febc11  meas stage tint
       OI_GREEN      #009E73  Input Image chevron
       OI_PURPLE     #CC79A7  aux wires / Pipeline container
       OI_VERMILION  #D55E00  validation error / "!" badge
       COLOR_SURFACE #ffffff  canvas background
       COLOR_BORDER  #dde3ed  default 1px border
  -->

  <!-- Canvas background -->
  <rect x="0" y="0" width="1080" height="540" fill="#f5f7fa"/>
  <rect x="12" y="12" width="1056" height="516" rx="8" ry="8"
        fill="#ffffff" stroke="#dde3ed" stroke-width="1"/>

  <defs>
    <!-- Arrowhead for image-flow wires (blue, solid) -->
    <marker id="arrow-image" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1b75bc"/>
    </marker>
    <!-- Arrowhead for aux wires (purple, dashed) -->
    <marker id="arrow-aux" markerWidth="10" markerHeight="10" refX="8" refY="5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CC79A7"/>
    </marker>
  </defs>

  <!-- Diagram title -->
  <text x="540" y="48" text-anchor="middle"
        font-size="20" font-weight="600" fill="#003660">
    Pipeline builder canvas — block, port, and wire visual language
  </text>
  <text x="540" y="72" text-anchor="middle"
        font-size="13" fill="#475569">
    Spec §4.1–§4.3 (DAG redesign)
  </text>

  <!-- =================================================================
       (1) Input Image — green chevron, no image-in, implicit image-out
       ================================================================= -->
  <g transform="translate(60, 200)">
    <text x="60" y="-18" text-anchor="middle"
          font-size="12" font-weight="600" fill="#003660">Input Image</text>
    <text x="60" y="-4" text-anchor="middle"
          font-size="10" fill="#64748b">(root scope source)</text>
    <!-- Chevron: pentagonal shape pointing right -->
    <polygon points="0,0 90,0 120,32 90,64 0,64"
             fill="#009E73" fill-opacity="0.18"
             stroke="#009E73" stroke-width="2"/>
    <text x="48" y="38" text-anchor="middle"
          font-size="13" font-weight="600" fill="#003660">image</text>
    <!-- Output port (right tip of chevron, neutral) -->
    <circle cx="120" cy="32" r="5"
            fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- =================================================================
       (2) Regular op — image-in (blue circle), image-out (neutral),
                        aux-in (purple square bottom)
       ================================================================= -->
  <g transform="translate(280, 168)">
    <text x="90" y="-18" text-anchor="middle"
          font-size="12" font-weight="600" fill="#003660">Regular op</text>
    <text x="90" y="-4" text-anchor="middle"
          font-size="10" fill="#64748b">image-in · image-out · aux-in</text>
    <!-- Block body (ops stage tint) -->
    <rect x="0" y="0" width="180" height="96" rx="10" ry="10"
          fill="#003660" fill-opacity="0.10"
          stroke="#003660" stroke-width="1"/>
    <text x="90" y="40" text-anchor="middle"
          font-size="14" font-weight="600" fill="#003660">BlurGauss</text>
    <text x="90" y="58" text-anchor="middle"
          font-size="11" fill="#475569">sigma = 2.0</text>
    <!-- Image-in port (left edge, blue circle) -->
    <circle cx="0" cy="48" r="6"
            fill="#1b75bc" stroke="#1b75bc" stroke-width="1.5"/>
    <text x="-18" y="52" text-anchor="end"
          font-size="10" fill="#1b75bc" font-weight="600">in</text>
    <!-- Image-out port (right edge, neutral) -->
    <circle cx="180" cy="48" r="6"
            fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="198" y="52" text-anchor="start"
          font-size="10" fill="#475569" font-weight="600">out</text>
    <!-- Aux-in port (bottom edge, purple square, scalar) -->
    <rect x="84" y="90" width="12" height="12" rx="2" ry="2"
          fill="#CC79A7" stroke="#CC79A7" stroke-width="1.5"/>
    <text x="90" y="124" text-anchor="middle"
          font-size="10" fill="#CC79A7" font-weight="600">inoculum_detector</text>
  </g>

  <!-- =================================================================
       (3) Pipeline container — purple border, title bar,
                                consumer-fed dot inside
       ================================================================= -->
  <g transform="translate(580, 130)">
    <text x="140" y="-18" text-anchor="middle"
          font-size="12" font-weight="600" fill="#003660">Pipeline container</text>
    <text x="140" y="-4" text-anchor="middle"
          font-size="10" fill="#64748b">aux mode — left unwired, consumer feeds image</text>
    <!-- Outer container body (purple-bordered) -->
    <rect x="0" y="0" width="280" height="180" rx="12" ry="12"
          fill="#CC79A7" fill-opacity="0.06"
          stroke="#CC79A7" stroke-width="1.5"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="280" height="28" rx="12" ry="12"
          fill="#CC79A7" fill-opacity="0.18"
          stroke="none"/>
    <rect x="0" y="16" width="280" height="12"
          fill="#CC79A7" fill-opacity="0.18"
          stroke="none"/>
    <text x="14" y="19" text-anchor="start"
          font-size="13" font-weight="600" fill="#003660">▼ Pipeline — inoculum_preproc</text>
    <!-- Consumer-fed dot (inner-left, mirrors Input Image source) -->
    <circle cx="20" cy="100" r="6"
            fill="#CC79A7" stroke="#CC79A7" stroke-width="1.5"/>
    <text x="20" y="124" text-anchor="middle"
          font-size="9" fill="#CC79A7" font-weight="600">consumer-fed</text>
    <!-- Inner op block (ops stage tint) -->
    <rect x="60" y="76" width="120" height="48" rx="8" ry="8"
          fill="#003660" fill-opacity="0.10"
          stroke="#003660" stroke-width="1"/>
    <text x="120" y="98" text-anchor="middle"
          font-size="11" font-weight="600" fill="#003660">OtsuDetector</text>
    <text x="120" y="114" text-anchor="middle"
          font-size="10" fill="#475569">(inner block)</text>
    <!-- Inner image-in port -->
    <circle cx="60" cy="100" r="5"
            fill="#1b75bc" stroke="#1b75bc" stroke-width="1.5"/>
    <!-- Inner image-out port (neutral) -->
    <circle cx="180" cy="100" r="5"
            fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <!-- Outer image-in (left edge, dimmed — aux mode) -->
    <circle cx="0" cy="100" r="6"
            fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"
            stroke-dasharray="2 2"/>
    <text x="-18" y="104" text-anchor="end"
          font-size="10" fill="#94a3b8" font-weight="600">in</text>
    <!-- Container right output port (neutral; wire colour follows target) -->
    <circle cx="280" cy="100" r="6"
            fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="298" y="104" text-anchor="start"
          font-size="10" fill="#475569" font-weight="600">out</text>
    <!-- Inner consumer-fed → OtsuDetector image edge -->
    <line x1="26" y1="100" x2="60" y2="100"
          stroke="#1b75bc" stroke-width="2"
          marker-end="url(#arrow-image)"/>
    <!-- Inner OtsuDetector → container right edge (image-flow within scope) -->
    <line x1="180" y1="100" x2="274" y2="100"
          stroke="#1b75bc" stroke-width="2"
          marker-end="url(#arrow-image)"/>
  </g>

  <!-- =================================================================
       (4) Validation-failing block — red border + "!" badge
       ================================================================= -->
  <g transform="translate(350, 380)">
    <text x="110" y="-18" text-anchor="middle"
          font-size="12" font-weight="600" fill="#003660">Validation failure</text>
    <text x="110" y="-4" text-anchor="middle"
          font-size="10" fill="#64748b">required aux unwired — Rule 3</text>
    <!-- Block body with red border -->
    <rect x="0" y="0" width="220" height="84" rx="10" ry="10"
          fill="#febc11" fill-opacity="0.08"
          stroke="#D55E00" stroke-width="2.5"/>
    <text x="110" y="36" text-anchor="middle"
          font-size="13" font-weight="600" fill="#003660">FilamentousFungiDetector</text>
    <text x="110" y="54" text-anchor="middle"
          font-size="11" fill="#475569">(meas stage)</text>
    <!-- Image-in (blue) -->
    <circle cx="0" cy="42" r="6"
            fill="#1b75bc" stroke="#1b75bc" stroke-width="1.5"/>
    <!-- Image-out (neutral) -->
    <circle cx="220" cy="42" r="6"
            fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <!-- Required aux port (red ring; hollow) -->
    <rect x="104" y="78" width="12" height="12" rx="2" ry="2"
          fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
    <text x="110" y="112" text-anchor="middle"
          font-size="10" fill="#D55E00" font-weight="600">required: not wired</text>
    <!-- "!" badge top-right -->
    <circle cx="216" cy="-4" r="11"
            fill="#D55E00" stroke="#ffffff" stroke-width="1.5"/>
    <text x="216" y="0" text-anchor="middle"
          font-size="14" font-weight="700" fill="#ffffff">!</text>
  </g>

  <!-- =================================================================
       Wires connecting the canonical examples
       ================================================================= -->
  <!-- Input Image (right port at 180,232 in canvas coords) →
       BlurGauss image-in (left port at 280,216) — blue solid -->
  <line x1="180" y1="232" x2="274" y2="216"
        stroke="#1b75bc" stroke-width="3"
        marker-end="url(#arrow-image)"/>
  <text x="223" y="218" text-anchor="middle"
        font-size="10" fill="#1b75bc" font-weight="600">image-flow</text>

  <!-- =================================================================
       Legend
       ================================================================= -->
  <g transform="translate(720, 380)">
    <rect x="0" y="0" width="320" height="120" rx="10" ry="10"
          fill="#ffffff" stroke="#dde3ed" stroke-width="1"/>
    <text x="14" y="22" font-size="12" font-weight="700" fill="#003660">
      Legend
    </text>
    <!-- Image-flow swatch -->
    <line x1="14" y1="42" x2="48" y2="42"
          stroke="#1b75bc" stroke-width="3"
          marker-end="url(#arrow-image)"/>
    <text x="60" y="46" font-size="11" fill="#003660">image-flow wire (blue solid)</text>
    <!-- Aux swatch -->
    <line x1="14" y1="64" x2="48" y2="64"
          stroke="#CC79A7" stroke-width="2"
          stroke-dasharray="6 4"
          marker-end="url(#arrow-aux)"/>
    <text x="60" y="68" font-size="11" fill="#003660">aux wire (purple dashed)</text>
    <!-- Image-in port swatch -->
    <circle cx="22" cy="86" r="5"
            fill="#1b75bc" stroke="#1b75bc" stroke-width="1.5"/>
    <text x="60" y="90" font-size="11" fill="#003660">image-in port (filled blue)</text>
    <!-- Aux-in port swatch -->
    <rect x="16" y="100" width="12" height="12" rx="2" ry="2"
          fill="#CC79A7" stroke="#CC79A7" stroke-width="1.5"/>
    <text x="60" y="112" font-size="11" fill="#003660">aux-in port (purple square)</text>
  </g>
</svg>
