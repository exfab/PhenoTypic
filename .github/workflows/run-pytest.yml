name: run-pytest
# Testmon caching strategy:
# pytest-testmon records which source files each test depends on (stored in .testmondata, a SQLite file).
# On PR runs, we restore the .testmondata cache built from main so testmon only runs tests whose
# dependencies changed in the PR. On pushes to main (after merge), we run with --testmon to update
# the baseline cache for future PRs. On cache miss (first run, or dependency change), testmon runs
# everything -- this is expected, not an error. Limitation: testmon tracks Python source only, not
# config files, data fixtures, or environment variables.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Prevent duplicate runs on the same PR/commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  check-manual-run:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.set-output.outputs.skip }}
    steps:
      - name: Check for successful manual run
        if: github.event_name == 'pull_request'
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            
            // Get workflow runs for this workflow
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '.github/workflows/run-pytest.yml',
              event: 'workflow_dispatch',
              head_sha: headSha,
              status: 'success',
              per_page: 1
            });
            
            // Check if there's a successful manual run for this PR/commit
            if (runs.workflow_runs.length > 0) {
              const manualRun = runs.workflow_runs[0];
              // Verify it's for the same commit
              if (manualRun.head_sha === headSha) {
                core.setOutput('skip', 'true');
                core.info(`Skipping tests: Found successful manual run #${manualRun.id} for commit ${headSha}`);
                return;
              }
            }
            
            core.setOutput('skip', 'false');

      - name: Set output
        id: set-output
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "skip=${{ steps.check.outputs.skip }}" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  tests-linux:
    needs: check-manual-run
    # Run Linux tests unless a successful manual run exists
    if: needs.check-manual-run.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: test Python 3.10, 3.11, 3.12
          - os: ubuntu-latest
            pixi-env: "test-py310"
          - os: ubuntu-latest
            pixi-env: "test-py311"
          - os: ubuntu-latest
            pixi-env: "test-py312"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          environments: ${{ matrix.pixi-env }}

      - name: Cache testmon data
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-${{ matrix.pixi-env }}-${{ github.ref_name }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            testmon-${{ runner.os }}-${{ matrix.pixi-env }}-main-${{ hashFiles('pixi.lock') }}-
            testmon-${{ runner.os }}-${{ matrix.pixi-env }}-main-

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            pixi run -e ${{ matrix.pixi-env }} test-parallel
          else
            pixi run -e ${{ matrix.pixi-env }} test-testmon
          fi

  tests-windows:
    needs: check-manual-run
    # Run Windows tests unless a successful manual run exists
    if: needs.check-manual-run.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: only Python 3.12
          - os: windows-latest
            pixi-env: "test-py312"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          environments: ${{ matrix.pixi-env }}

      - name: Cache testmon data
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-${{ matrix.pixi-env }}-${{ github.ref_name }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            testmon-${{ runner.os }}-${{ matrix.pixi-env }}-main-${{ hashFiles('pixi.lock') }}-
            testmon-${{ runner.os }}-${{ matrix.pixi-env }}-main-

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            pixi run -e ${{ matrix.pixi-env }} test-parallel
          else
            pixi run -e ${{ matrix.pixi-env }} test-testmon
          fi

  tests-macos:
    needs: check-manual-run
    # Run macOS tests only when the repository is public and no successful manual run exists
    if: needs.check-manual-run.outputs.skip != 'true' && github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: only Python 3.12
          - os: macos-14
            pixi-env: "test-py312"

    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          environments: ${{ matrix.pixi-env }}

      - name: Cache testmon data
        uses: actions/cache@v4
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-${{ matrix.pixi-env }}-${{ github.ref_name }}-${{ hashFiles('pixi.lock') }}-${{ github.sha }}
          restore-keys: |
            testmon-${{ runner.os }}-${{ matrix.pixi-env }}-main-${{ hashFiles('pixi.lock') }}-
            testmon-${{ runner.os }}-${{ matrix.pixi-env }}-main-

      - name: Run tests
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            pixi run -e ${{ matrix.pixi-env }} test-parallel
          else
            pixi run -e ${{ matrix.pixi-env }} test-testmon
          fi

  docs-build:
    needs: check-manual-run
    if: needs.check-manual-run.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.8.0
        with:
          environments: docs

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build documentation (test only)
        run: |
          pixi run -e docs docs-build
