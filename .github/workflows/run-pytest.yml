name: run-pytest
# Fast PR lane. Goal: ~10-15 min wall-clock for PR-time signal.
#
# Matrix: Linux x Python {3.11 (floor), 3.12 (ceiling)}. Windows, macOS, and
# any intermediate Python move to the nightly full lane in
# ``run-pytest-full.yml``. Slow tests are excluded by default via
# ``addopts = "-m 'not slow'"`` in pyproject.toml.
#
# Testmon caching strategy:
#   pytest-testmon records (per test) which source files each test
#   executed and stores a per-block content hash in ``.testmondata`` (a
#   SQLite file). On the next run, tests whose tracked source blocks all
#   match are deselected at collection time. We persist ``.testmondata``
#   across runs via ``actions/cache``.
#
#   * ``push: branches: [main]`` runs ``pytest --testmon`` and saves the
#     cache under a key that includes ``${{ github.ref_name }} = main``.
#     This is the ONLY workflow that produces a main-prefixed cache —
#     ``run-pytest-full.yml`` deliberately runs without ``--testmon`` so
#     it can exercise every test on a clean run.
#   * ``pull_request`` runs restore the main-prefixed cache via the
#     ``restore-keys`` chain, so testmon sees every source file as
#     unchanged except those edited in the PR. Tests whose tracked
#     blocks intersect the edited set re-run; the rest are deselected.
#   * Cache miss (first run after the trigger lands, or after a uv.lock
#     bump) means testmon runs everything — expected, not an error.
#
# Limitation: testmon tracks Python source only — not YAML/JSON config,
# fixture files, image assets, or environment variables. If a test's
# correctness depends on one of those, the full lane catches it.

on:
  pull_request:
    branches: [ main, dev ]
  push:
    # Seed the main-prefixed ``.testmondata`` cache that PR runs restore
    # via ``restore-keys``. Without this trigger, no workflow ever writes
    # a cache with ``main`` in the key, and every PR run starts cold.
    branches: [ main ]
  workflow_dispatch:

# Prevent duplicate runs on the same PR/commit
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  check-manual-run:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.set-output.outputs.skip }}
    steps:
      - name: Check for successful manual run
        if: github.event_name == 'pull_request'
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            
            // Get workflow runs for this workflow
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '.github/workflows/run-pytest.yml',
              event: 'workflow_dispatch',
              head_sha: headSha,
              status: 'success',
              per_page: 1
            });
            
            // Check if there's a successful manual run for this PR/commit
            if (runs.workflow_runs.length > 0) {
              const manualRun = runs.workflow_runs[0];
              // Verify it's for the same commit
              if (manualRun.head_sha === headSha) {
                core.setOutput('skip', 'true');
                core.info(`Skipping tests: Found successful manual run #${manualRun.id} for commit ${headSha}`);
                return;
              }
            }
            
            core.setOutput('skip', 'false');

      - name: Set output
        id: set-output
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "skip=${{ steps.check.outputs.skip }}" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

  tests-linux:
    needs: check-manual-run
    # Run Linux tests unless a successful manual run exists
    if: needs.check-manual-run.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu: floor (3.11) + ceiling (3.12).
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"

    runs-on: ${{ matrix.os }}
    # Headless Qt: the ``qt-test`` group (and the napari extra) pull PyQt6,
    # whose QtGui is imported by the pytest-qt plugin at configure time. Qt6's default xcb
    # platform plugin needs a display; ``offscreen`` lets the qtbot widget
    # tests run on the displayless runner. (PyQt5 did not require this.)
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # exiftool: raw image metadata. The Qt6 runtime libs (libEGL/libGL/
          # libxkbcommon/libdbus) are required by PyQt6's QtGui, which the
          # pytest-qt plugin imports at configure time -- without libEGL.so.1
          # the whole session aborts with an INTERNALERROR before collection.
          sudo apt-get install -y \
            exiftool libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv lock
          uv sync --group dev --group test-qt --all-extras

      - name: Cache testmon data
        uses: actions/cache@v5
        with:
          path: .testmondata
          key: testmon-${{ runner.os }}-py${{ matrix.python-version }}-${{ github.ref_name }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: |
            testmon-${{ runner.os }}-py${{ matrix.python-version }}-main-${{ hashFiles('uv.lock') }}-
            testmon-${{ runner.os }}-py${{ matrix.python-version }}-main-

      - name: Run tests
        run: |
          source .venv/bin/activate
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            pytest -q --tb=long -r "Efw" --no-header -n auto  # Full parallel run, addopts still excludes -m slow
          else
            pytest -q --tb=long -r "Efw" --no-header --testmon  # Selective: PR (skip unchanged dependencies)
          fi

  # tests-windows and tests-macos moved to .github/workflows/run-pytest-full.yml
  # which runs nightly + on push to main + on workflow_dispatch.
