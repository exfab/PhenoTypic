name: run-pytest
# Fast PR lane. Goal: ~10-15 min wall-clock for PR-time signal.
#
# Matrix: Linux x Python {3.11 (floor), 3.12 (ceiling)} x logical ownership
# shards loaded from .github/pytest-shards.json. Windows, macOS, and slow tests
# remain in run-pytest-full.yml.
# Every shard runs its complete non-slow test set and uses pytest-xdist
# within the runner. The shard manifest is coverage-checked by
# tests/unit/ci/test_pytest_shard_manifest.py, so a new test cannot be
# silently omitted or assigned to more than one shard.
#
# Only the GUI shard installs Chromium. Dependency download caches remain
# enabled through setup-uv, but test results and test-selection state are
# never cached.

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main ]
  workflow_dispatch:

# Prevent duplicate runs on the same PR/commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  check-manual-run:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.load-shards.outputs.shards }}
      skip: ${{ steps.set-output.outputs.skip }}
    steps:
      - uses: actions/checkout@v6

      - name: Load pytest shards
        id: load-shards
        run: echo "shards=$(jq -c . .github/pytest-shards.json)" >> "$GITHUB_OUTPUT"

      - name: Check for successful manual run
        if: github.event_name == 'pull_request'
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;

            // Get workflow runs for this workflow.
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: '.github/workflows/run-pytest.yml',
              event: 'workflow_dispatch',
              head_sha: headSha,
              status: 'success',
              per_page: 1
            });

            // Check if there is a successful manual run for this commit.
            if (runs.workflow_runs.length > 0) {
              const manualRun = runs.workflow_runs[0];
              if (manualRun.head_sha === headSha) {
                core.setOutput('skip', 'true');
                core.info(`Skipping tests: Found successful manual run #${manualRun.id} for commit ${headSha}`);
                return;
              }
            }

            core.setOutput('skip', 'false');

      - name: Set output
        id: set-output
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "skip=${{ steps.check.outputs.skip }}" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  tests-linux:
    name: Linux py${{ matrix.python-version }} / ${{ matrix.shard.name }}
    needs: check-manual-run
    # Run Linux tests unless a successful manual run exists.
    if: needs.check-manual-run.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: ${{ fromJSON(needs.check-manual-run.outputs.shards) }}

    runs-on: ubuntu-latest
    # Headless Qt: the test-qt group and napari extra pull PyQt6, whose
    # QtGui is imported by pytest-qt at configure time. The offscreen
    # platform lets widget tests run on a displayless runner.
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # exiftool handles raw image metadata. The Qt6 runtime libraries
          # are required when pytest-qt imports QtGui during configuration.
          sudo apt-get install -y \
            exiftool libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv lock
          uv sync --group dev --group test-qt --all-extras

      - name: Install Playwright browser
        if: matrix.shard.playwright
        run: uv run playwright install --with-deps chromium

      - name: Run ${{ matrix.shard.name }} tests
        run: |
          source .venv/bin/activate
          pytest -q --tb=long -r "Efw" --no-header -n auto \
            ${{ join(matrix.shard.paths, ' ') }}

  # Windows and macOS run in .github/workflows/run-pytest-full.yml.
