name: docs-prune

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version slot to remove (e.g. v0.14.0b5 or experimental)'
        required: true
  delete:
  release:
    types: [deleted, unpublished]

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prune:
    if: github.event_name != 'delete' || github.event.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DELETE_REF: ${{ github.event.ref }}
      MANUAL_VERSION: ${{ inputs.version }}
    steps:
      - name: Resolve target version
        id: v
        run: |
          case "$GITHUB_EVENT_NAME" in
            release)           TARGET="$RELEASE_TAG" ;;
            delete)            TARGET="$DELETE_REF" ;;
            workflow_dispatch) TARGET="$MANUAL_VERSION" ;;
            *)                 echo "unexpected event: $GITHUB_EVENT_NAME" >&2; exit 1 ;;
          esac
          if [[ -z "$TARGET" || "$TARGET" == *".."* || "$TARGET" == */* ]]; then
            echo "refusing unsafe version: '$TARGET'" >&2
            exit 1
          fi
          if [[ "$TARGET" != "experimental" && ! "$TARGET" =~ ^v[A-Za-z0-9._+-]+$ ]]; then
            echo "refusing non-conforming version: '$TARGET'" >&2
            exit 1
          fi
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Checkout source (for regen script)
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 1

      - name: Remove target directory
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          rm -rf "gh-pages/${TARGET}"

      - name: Install packaging for regen script
        run: |
          python -m pip install --quiet packaging

      - name: Regenerate versions.json and index.html
        run: |
          python src/.github/scripts/regen_versions_json.py gh-pages

      - name: Commit and push gh-pages
        working-directory: gh-pages
        env:
          TARGET: ${{ steps.v.outputs.target }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes to commit (target '$TARGET' was already absent)."
          else
            git commit -m "Prune ${TARGET}"
            git push origin gh-pages
          fi
