name: package-integrity
#
# RELOCATE BEFORE USE: move this file to ``.github/workflows/package.yml``
# for GitHub Actions to pick it up. It is staged here because the bot's
# token lacks the ``workflow`` scope required to push into
# ``.github/workflows/``; a maintainer with that scope should run:
#     git mv .github/package-integrity.ci.yml .github/workflows/package.yml
#
# Verifies the built distribution is deployable via ``pip`` -- specifically
# that the GUI sub-app static assets (CSS/JS + vendored OpenSeadragon icons)
# are shipped in the wheel. Regression guard for the bug where a
# ``pip install``ed ``phenotypic-gui`` crashed on import because
# ``gui/shell/_assets/shell.css`` (read at import time) was missing.
#
# Deliberately NOT part of the fast PR lane: it shells out to ``uv build``
# and installs the wheel into a clean venv, which is slow and
# environment-sensitive. Runs on version tags, on PRs that touch packaging
# inputs, and on demand.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "src/phenotypic/**"
      - "tests/integration/packaging/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    strategy:
      fail-fast: false
      matrix:
        # Matches requires-python (>=3.11, <3.13). The <3.13 ceiling is
        # mahotas 1.4.18 (no cp313 wheel), not zarr.
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Build sdist + wheel
        run: uv build --out-dir dist

      - name: Validate distribution metadata
        run: uvx twine check dist/*

      - name: Inspect artifact contents (Layer 1)
        # Lightweight: the build-artifact tests only walk the source tree and
        # shell out to ``uv build`` -- they don't import ``phenotypic``, so an
        # ephemeral pytest env (no full project sync) is enough.
        run: >
          uv run --no-project --with pytest
          pytest tests/integration/packaging/test_package_contents.py -m slow -v

      - name: Install wheel into a clean venv and verify runtime assets
        # Layer 2 + smoke. Installs the built WHEEL (not the source tree) so a
        # missing packaged asset fails exactly as it would for a real
        # ``pip install`` user. Runs the resource-access tests from a copied
        # file in /tmp so the repo's conftest/source tree never leaks onto
        # ``sys.path`` and mask a packaging gap.
        run: |
          set -euxo pipefail
          python -m venv /tmp/install_env
          /tmp/install_env/bin/pip install --upgrade pip
          /tmp/install_env/bin/pip install "$(echo dist/*.whl)" pytest
          # The exact import that crashes on a broken wheel, plus the entry point.
          /tmp/install_env/bin/python -c "import phenotypic.gui.shell._layout"
          /tmp/install_env/bin/phenotypic-gui --help
          cp tests/integration/packaging/test_asset_access.py /tmp/test_asset_access.py
          cd /tmp && /tmp/install_env/bin/pytest /tmp/test_asset_access.py -v -p no:cacheprovider
