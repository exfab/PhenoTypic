name: run-pytest-full
# Nightly full lane. Runs the cross-platform matrix and includes
# slow-marked tests, which are excluded from the PR lane in run-pytest.yml.
#
# Triggers:
#   * schedule (15:00 UTC = 07:00 PST nightly) — catch flakes and time-sensitive regressions
#   * workflow_dispatch                         — manual full run on any ref
#
# Matrix: {Linux x Python {3.11, 3.12}, macOS-14 x 3.12 (public repo only),
# Windows-latest x 3.12} x the logical ownership shards in
# .github/pytest-shards.json -- the same manifest run-pytest.yml uses. The
# manifest is coverage-checked by tests/unit/ci/test_pytest_shard_manifest.py,
# so the union of the shards is exactly the configured testpaths: splitting
# the lane drops no test and runs none twice. Each shard uses pytest-xdist
# within its runner, and a red shard names the failing area in the job title.
#
# Run command override:
#   ``-o "addopts=-q --tb=long -r 'Efw' --no-header"`` overrides the
#   ``addopts = "--verbose --capture=no -m 'not slow'"`` default in
#   pyproject.toml so slow tests are collected and run while CI logs stay
#   focused on failures/errors/warnings instead of every passing test item.
#
# No --testmon: the nightly lane is a clean full run; testmon's "skip
# unchanged" semantics are useless when we want to run everything.

on:
  schedule:
    # 15:00 UTC = 07:00 PST. GitHub cron is UTC-only and never observes
    # DST, so this fires at 08:00 Pacific while PDT (Mar-Nov) is in effect.
    - cron: '0 15 * * *'
  workflow_dispatch:

# Never cancel a running nightly: a scheduled or manual run that starts
# mid-sweep shouldn't abort an in-flight slow-test run. Both will complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load-shards:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.load-shards.outputs.shards }}
    steps:
      - uses: actions/checkout@v6

      - name: Load pytest shards
        id: load-shards
        run: echo "shards=$(jq -c . .github/pytest-shards.json)" >> "$GITHUB_OUTPUT"

  tests-linux-full:
    name: Linux py${{ matrix.python-version }} / ${{ matrix.shard.name }}
    needs: load-shards
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        shard: ${{ fromJSON(needs.load-shards.outputs.shards) }}

    runs-on: ubuntu-latest
    # Headless Qt: the ``test-qt`` group (and the napari extra) pull PyQt6,
    # whose QtGui is imported by pytest-qt at configure time; ``offscreen``
    # lets the qtbot widget tests run on the displayless Linux runner.
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt6 runtime libs (libEGL/libGL/libxkbcommon/libdbus) for PyQt6's
          # QtGui, imported by pytest-qt at configure time; without libEGL.so.1
          # the pytest session aborts (INTERNALERROR) before collection.
          sudo apt-get install -y \
            exiftool libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv lock
          uv sync --group dev --group test-qt --all-extras

      - name: Install Playwright browsers
        if: matrix.shard.playwright
        run: uv run playwright install --with-deps chromium

      - name: Run ${{ matrix.shard.name }} tests (full, slow included)
        run: |
          source .venv/bin/activate
          pytest -n auto -o "addopts=-q --tb=long -r 'Efw' --no-header" --durations=20 ${{ join(matrix.shard.paths, ' ') }}

  tests-macos-full:
    name: macOS py${{ matrix.python-version }} / ${{ matrix.shard.name }}
    needs: load-shards
    if: github.event.repository.visibility == 'public'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        python-version: ["3.12"]
        shard: ${{ fromJSON(needs.load-shards.outputs.shards) }}

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv lock
          uv sync --group dev --group test-qt --all-extras

      - name: Install Playwright browsers
        if: matrix.shard.playwright
        run: uv run playwright install chromium

      - name: Run ${{ matrix.shard.name }} tests (full, slow included)
        run: |
          source .venv/bin/activate
          pytest -n auto -o "addopts=-q --tb=long -r 'Efw' --no-header" --durations=20 ${{ join(matrix.shard.paths, ' ') }}

  tests-windows-full:
    name: Windows py${{ matrix.python-version }} / ${{ matrix.shard.name }}
    needs: load-shards
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        python-version: ["3.12"]
        shard: ${{ fromJSON(needs.load-shards.outputs.shards) }}

    runs-on: ${{ matrix.os }}
    # Git Bash, not pwsh: shard paths include globs (``tests/unit/test_*.py``)
    # that PowerShell would pass to pytest unexpanded.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv lock
          uv sync --group dev --group test-qt --all-extras

      - name: Run ${{ matrix.shard.name }} tests (full, slow included)
        run: |
          source .venv/Scripts/activate
          pytest -n auto -o "addopts=-q --tb=long -r 'Efw' --no-header" --durations=20 ${{ join(matrix.shard.paths, ' ') }}
