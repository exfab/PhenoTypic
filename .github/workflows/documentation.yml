name: documentation

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: gh-pages-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: deploy-documentation-to-github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning

      - name: Resolve DOCS_VERSION
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "DOCS_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "DOCS_VERSION=experimental" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache phenotypic sample data
        uses: actions/cache@v5
        with:
          path: ~/.cache/phenotypic
          key: phenotypic-data-data-v1

      - name: Install dependencies
        run: |
          uv sync --all-extras --group dev --group docs

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Sphinx build
        working-directory: docs
        env:
          DOCS_VERSION: ${{ env.DOCS_VERSION }}
        run: |
          uv run make html
          touch build/html/.nojekyll

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Copy build into version slot
        run: |
          mkdir -p "gh-pages/${DOCS_VERSION}"
          rsync -a --delete docs/build/html/ "gh-pages/${DOCS_VERSION}/"

      - name: Auto-prune matching pre-releases on stable release
        if: env.DOCS_VERSION != 'experimental'
        run: |
          if [[ "$DOCS_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            base="$DOCS_VERSION"
            shopt -s nullglob
            for d in gh-pages/${base}a* gh-pages/${base}b* gh-pages/${base}rc* gh-pages/${base}.dev*; do
              echo "Pruning pre-release: $d"
              rm -rf "$d"
            done
          fi

      - name: Install packaging for regen script
        run: |
          python -m pip install --quiet packaging

      - name: Regenerate versions.json and index.html
        run: |
          python .github/scripts/regen_versions_json.py gh-pages

      - name: Commit and push gh-pages
        working-directory: gh-pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No gh-pages changes to commit."
          else
            git commit -m "Deploy ${DOCS_VERSION} @ ${GITHUB_SHA}"
            git push origin gh-pages
          fi
