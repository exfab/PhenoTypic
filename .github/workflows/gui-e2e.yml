name: gui-e2e

# Browser-driven Playwright E2E suite + FEATURES.md merge gate.
# Gated on path filters so unrelated PRs do not pay the browser-install cost.
# When this workflow triggers it MUST pass before merge.

on:
  push:
    branches: [main]
    paths:
      - 'src/phenotypic/gui/**'
      - 'src/phenotypic/_cli/_dashboard/**'
      - 'tests/e2e/gui/**'
      - 'tests/integration/gui/**'
      - 'pyproject.toml'
      - 'scripts/check_features_md.py'
      - '.github/workflows/gui-e2e.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/phenotypic/gui/**'
      - 'src/phenotypic/_cli/_dashboard/**'
      - 'tests/e2e/gui/**'
      - 'tests/integration/gui/**'
      - 'pyproject.toml'
      - 'scripts/check_features_md.py'
      - '.github/workflows/gui-e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  features-md-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Need full history so ``git diff origin/<base>..HEAD`` works on PRs.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 'Cross-PR check: gui/ touched implies FEATURES.md modified'
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # Ensure the base branch is fetched so merge-base resolves.
          git fetch origin "$BASE_REF" --depth=1 || true
          BASE_SHA=$(git merge-base "origin/$BASE_REF" HEAD)
          TOUCHED_GUI=$(git diff --name-only "$BASE_SHA"..HEAD -- 'src/phenotypic/gui/' || true)
          TOUCHED_FEATURES=$(git diff --name-only "$BASE_SHA"..HEAD -- 'src/phenotypic/gui/FEATURES.md' || true)
          if [ -n "$TOUCHED_GUI" ] && [ -z "$TOUCHED_FEATURES" ]; then
            echo "::error::PR touches src/phenotypic/gui/ without modifying FEATURES.md"
            echo "Touched files under src/phenotypic/gui/:"
            echo "$TOUCHED_GUI"
            exit 1
          fi

      - name: 'Per-PR check: FEATURES.md syntax + shipping ref resolution'
        run: python scripts/check_features_md.py

      - name: 'Merge gate: reject any in-progress rows'
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/check_features_md.py --strict

  e2e:
    needs: features-md-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y exiftool

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: 'latest'

      - name: Install dependencies
        run: |
          uv lock
          uv sync --group dev --all-extras

      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium

      - name: Run integration GUI tests (Flask test client)
        run: |
          source .venv/bin/activate
          if compgen -G "tests/integration/gui/test_*.py" > /dev/null; then
            pytest tests/integration/gui -v
          else
            echo "No integration GUI tests yet; skipping."
          fi

      - name: Run E2E GUI tests (Playwright)
        env:
          PLAYWRIGHT: '1'
        run: |
          source .venv/bin/activate
          if compgen -G "tests/e2e/gui/test_*.py" > /dev/null; then
            # ``ci_flaky`` deselects e2e tests that pass locally but
            # stochastically exceed Playwright DOM-poll budgets on
            # shared GHA runners. See tests/CLAUDE.md for the convention.
            pytest tests/e2e/gui -v -m "not ci_flaky"
          else
            echo "No E2E GUI tests yet; skipping."
          fi
